<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Caja Seca | SA-MP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #071a33, #020712);
    color: #fff;
    overflow-x: hidden;
}

/* ===== FONDO ANIMADO ===== */
.bg {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 30%, rgba(0,191,255,.18), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,102,255,.15), transparent 40%);
    animation: bgMove 12s ease-in-out infinite alternate;
    z-index: -1;
}
@keyframes bgMove {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
}

/* ===== HEADER / LOGO ===== */
header {
    padding: 30px 40px;
}

.logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 34px;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #00bfff, #0059ff);
    -webkit-background-clip: text;
    color: transparent;
    animation: glow 2.5s infinite alternate;
}
@keyframes glow {
    from { text-shadow: 0 0 10px rgba(0,191,255,.3); }
    to   { text-shadow: 0 0 25px rgba(0,191,255,.8); }
}

/* ===== HERO ===== */
.hero {
    text-align: center;
    padding: 90px 20px 60px;
    animation: fadeUp 1s ease;
}
@keyframes fadeUp {
    from { opacity:0; transform: translateY(30px); }
    to { opacity:1; transform: translateY(0); }
}

.hero h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    margin-bottom: 15px;
}

.hero h1 span {
    display: block;
    font-size: 18px;
    color: #00bfff;
    margin-top: 10px;
}

.hero p {
    max-width: 700px;
    margin: 0 auto 35px;
    opacity: .9;
}

/* ===== STATS ===== */
.stats {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 30px;
}

.stat {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(12px);
    padding: 15px 25px;
    border-radius: 16px;
    box-shadow: 0 0 25px rgba(0,191,255,.15);
}

.stat strong {
    font-size: 22px;
    color: #00ff88;
}

/* ===== IP ===== */
.ip-box {
    display: inline-flex;
    gap: 15px;
    align-items: center;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(10px);
    padding: 15px 25px;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(0,191,255,.25);
    margin-bottom: 30px;
    transition: transform .3s;
}
.ip-box:hover { transform: scale(1.05); }

.ip-box button {
    background: linear-gradient(135deg, #00bfff, #004cff);
    border: none;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* ===== BOTÓN ===== */
.play-btn {
    display: inline-block;
    padding: 16px 40px;
    border-radius: 50px;
    background: linear-gradient(135deg, #00bfff, #004cff);
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    text-decoration: none;
    box-shadow: 0 0 35px rgba(0,191,255,.6);
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0% { box-shadow: 0 0 20px rgba(0,191,255,.4); }
    100% { box-shadow: 0 0 45px rgba(0,191,255,.9); }
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
    .hero h1 { font-size: 34px; }
    .stats { flex-direction: column; }
}
</style>
</head>

<body>

<div class="bg"></div>

<header>
    <div class="logo">CAJA SECA</div>
</header>

<section class="hero">
    <h1>
        CAJA SECA
        <span>San Andreas Multiplayer</span>
    </h1>

    <p>
        Roleplay callejero real. Bandas activas. Respeto en la calle.
        Si no aguantas presión, este server no es para ti.
    </p>

    <div class="stats">
        <div class="stat">
            🟢 <strong id="players">20</strong><br>
            Jugadores online
        </div>
        <div class="stat">
            🔫 Bandas activas<br>
            <strong>5 – 7</strong>
        </div>
    </div>

    <div class="ip-box">
        <span id="serverIP">188.93.139.96:1111</span>
        <button onclick="copiarIP()">Copiar IP</button>
    </div>

    <br>
    <a class="play-btn" href="samp://188.93.139.96:1111">CONECTAR SA-MP</a>
</section>

<script>
function copiarIP() {
    navigator.clipboard.writeText("188.93.139.96:1111");
}

/* CONTADOR FAKE */
setInterval(() => {
    let players = Math.floor(Math.random() * (27 - 15 + 1)) + 15;
    document.getElementById("players").innerText = players;
}, 5000);
</script>

</body>
</html>
