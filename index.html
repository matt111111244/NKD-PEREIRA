<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador - Formato Cotizador</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#fff;
  font-family:Arial,Helvetica,sans-serif;
  color:#111;
  font-size:14px;
}
.app{
  width:812px;
  margin:38px auto;
}
.topbar{
  height:43px;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  padding:0 50px;
  gap:75px;
  color:#777;
}
.topbar .brand{
  color:#00a83b;
  font-weight:bold;
}
.topbar .format{
  color:#555;
  font-size:15px;
}
.topbar .help{
  color:#777;
}
.title{
  margin-top:26px;
  height:29px;
  line-height:29px;
  text-align:center;
  background:#9cc4e4;
  color:#fff;
  font-size:21px;
  font-style:italic;
  font-weight:bold;
}
.info{
  display:grid;
  grid-template-columns:1fr 270px;
  min-height:150px;
  padding:10px 5px 0;
}
.company{
  font-style:italic;
  line-height:29px;
}
.logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
}
.logo{
  width:237px;
  height:100px;
  object-fit:cover;
  border:3px solid #506a79;
}
.dates{
  display:grid;
  grid-template-columns:115px 1fr;
  align-content:center;
  row-gap:11px;
  font-style:italic;
}
.dates .label{
  text-align:right;
  padding-right:13px;
  color:#76abe0;
  font-weight:bold;
}
.dates input{
  border:0;
  outline:0;
  font:inherit;
  padding:0;
  width:100%;
}
.section-title{
  height:25px;
  line-height:25px;
  background:#9cc4e4;
  color:#fff;
  text-align:center;
  font-weight:bold;
  font-style:italic;
}
.client{
  padding:0 5px;
}
.client-grid{
  padding-top:2px;
  display:grid;
  grid-template-columns:1fr;
  font-style:italic;
  line-height:23px;
}
.client-grid label{
  display:inline-block;
  min-width:100px;
}
.client-grid input{
  border:0;
  outline:0;
  font:inherit;
  width:70%;
}
.items{
  margin-top:22px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th{
  background:#9cc4e4;
  color:#fff;
  height:28px;
  font-style:italic;
}
td{
  border:1px solid #cfcfcf;
  padding:5px;
  height:30px;
}
td input{
  width:100%;
  border:0;
  outline:0;
  font:inherit;
  background:transparent;
}
.num{width:12%; text-align:right}
.money{width:17%; text-align:right}
.desc{width:51%}
.action{width:6%; text-align:center}
.right{text-align:right}
.summary{
  width:42%;
  margin-left:auto;
  margin-top:10px;
}
.summary div{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  border-bottom:1px solid #ccc;
  font-weight:bold;
}
.summary .grand{
  font-size:16px;
  background:#9cc4e4;
  color:#fff;
}
.terms{
  margin-top:25px;
}
.terms textarea{
  width:100%;
  min-height:80px;
  border:1px solid #ccc;
  padding:8px;
  resize:vertical;
  font-family:Arial;
}
.buttons{
  margin-top:12px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
}
button{
  border:0;
  padding:9px 14px;
  border-radius:4px;
  color:#fff;
  background:#555;
  cursor:pointer;
  font-weight:bold;
}
.add{background:#4b9bd1}
.pdf{background:#198754}
.delete{background:#c0392b;padding:4px 8px}
@media(max-width:850px){
  .app{width:96%;margin:15px auto}
  .topbar{padding:0 15px;gap:20px}
  .info{grid-template-columns:1fr}
  .logo-wrap{margin:5px 0 12px}
  .dates{margin-bottom:10px}
}
@media print{
  @page{size:A4;margin:10mm}
  body{font-size:12px}
  .app{width:100%;margin:0}
  .topbar,.buttons{display:none!important}
  .title{margin-top:0}
  .items{margin-top:15px}
  input,textarea{color:#111}
  .action{display:none}
  .logo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  <div class="section-title">DATOS DEL CLIENTE</div>
  <div class="client">
    <div class="client-grid">
      <div><label>Nombre:</label><input value="edificio los colores"></div>
      <div><label>Dirección:</label><input value="calle18d 41 27"></div>
      <div><label>CUIT-NIF:</label><input></div>
      <div><label>Teléfono:</label><input></div>
      <div><label>E-mail:</label><input></div>
    </div>
  </div>

  <div class="items">
    <table id="tabla">
      <thead>
        <tr>
          <th class="desc">DESCRIPCIÓN</th>
          <th class="num">UNIDADES</th>
          <th class="money">PRECIO</th>
          <th class="money">TOTAL</th>
          <th class="action"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input class="descripcion" value="Baño de 3 cm"></td>
          <td><input class="unidades right" type="number" min="0" value="1" oninput="calcular()"></td>
          <td><input class="precio right" type="number" min="0" value="500" oninput="calcular()"></td>
          <td class="fila-total right">$ 500</td>
          <td class="action"><button class="delete" onclick="eliminarFila(this)">X</button></td>
        </tr>
      </tbody>

  </div>

  <div class="buttons">
    <button class="add" onclick="agregarFila()">+ AGREGAR SERVICIO</button>
    <button class="pdf" onclick="descargarPDF()">⬇ DESCARGAR PDF</button>
  </div>
</div>

<script>
function formato(valor){
  return '$ ' + Number(valor || 0).toLocaleString('es-CO', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  });
}
function calcular(){
  let subtotal=0;
  document.querySelectorAll('#tabla tbody tr').forEach(fila=>{
    const unidades=parseFloat(fila.querySelector('.unidades').value)||0;
    const precio=parseFloat(fila.querySelector('.precio').value)||0;
    const total=unidades*precio;
    fila.querySelector('.fila-total').textContent=formato(total);
    subtotal+=total;
  });
  document.getElementById('subtotal').textContent=formato(subtotal);
  document.getElementById('total').textContent=formato(subtotal);
}
function agregarFila(){
  const fila=document.createElement('tr');
  fila.innerHTML=`
    <td><input class="descripcion" placeholder="Descripción del servicio"></td>
    <td><input class="unidades right" type="number" min="0" value="1" oninput="calcular()"></td>
    <td><input class="precio right" type="number" min="0" value="0" oninput="calcular()"></td>
    <td class="fila-total right">$ 0</td>
    <td class="action"><button class="delete" onclick="eliminarFila(this)">X</button></td>
  `;
  document.querySelector('#tabla tbody').appendChild(fila);
  calcular();
}
function eliminarFila(btn){
  btn.closest('tr').remove();
  calcular();
}
function descargarPDF(){
  window.print();
}
const hoy=new Date();
document.getElementById('fecha').value=
  hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');
calcular();
</script>
